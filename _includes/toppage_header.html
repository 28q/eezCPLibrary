<section class="dashboard-hero" aria-labelledby="dashboard-title">
  <div class="dashboard-hero-copy">
    <p class="dashboard-eyebrow">Competitive Programming Library</p>
    <h1 class="dashboard-title" id="dashboard-title">{{ site.title }}</h1>
    <p class="dashboard-description">
      検証状態を確認しながら、ライブラリとテストコードを素早く検索できます。
      一覧は <code>main</code> ブランチから自動生成されます。
    </p>

  </div>

  <div class="dashboard-search-panel panel">
    <label class="dashboard-search" for="library-search">
      <span class="dashboard-search-icon" aria-hidden="true"></span>
      <input
        id="library-search"
        type="search"
        autocomplete="off"
        placeholder="名前、パス、カテゴリで検索…"
        aria-label="ライブラリと検証ファイルを検索"
      >
      <kbd aria-hidden="true">/</kbd>
    </label>

    <p class="dashboard-result-summary" aria-live="polite">
      <strong id="result-count">0</strong>
      <span id="result-label">items</span>
      <span class="dashboard-result-hint">を表示中</span>
    </p>
  </div>
</section>
