---
layout: null
---

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f2f1eb">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ "/assets/css/site.css" | absolute_url }}">

  {% include mathjax.html %}

  <script>
    (function () {
      try {
        const saved = localStorage.getItem("eezcp-library-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
          return;
        }
      } catch (_) {}

      document.documentElement.dataset.theme =
        window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>

  <header class="site-topbar">
    <div class="site-topbar-inner">
      <a class="site-brand" href="{{ "/" | absolute_url }}" aria-label="{{ site.title }} ホーム">
        <span class="site-brand-mark" aria-hidden="true">E</span>
        <span class="site-brand-copy">
          <span class="site-brand-name">{{ site.title }}</span>
        </span>
      </a>

      <nav class="site-actions" aria-label="サイト操作">
        <a
          class="site-action site-verify-action"
          href="{{ site.github.repository_url }}/actions/workflows/verify.yml"
          id="verify-status-link"
          data-api-url="https://api.github.com/repos/{{ site.github.owner_name }}/{{ site.github.repository_name }}/actions/workflows/verify.yml/runs?branch=main&amp;per_page=1"
          aria-label="Verify：状態を取得中。ワークフローの実行状況を開く"
          title="Verify：状態を取得中"
        >
          <span class="verify-dot" id="verify-status-dot" data-status="loading" aria-hidden="true">●</span>
          <span class="site-action-label">Verify</span>
        </a>

        <a class="site-action" href="{{ site.github.repository_url }}" target="_blank" rel="noreferrer" aria-label="GitHubリポジトリを開く">
          <span aria-hidden="true">↗</span>
          <span class="site-action-label">GitHub</span>
        </a>

        <button class="site-icon-button" id="theme-toggle" type="button" aria-label="テーマを切り替える" title="テーマを切り替える">◐</button>
      </nav>
    </div>
  </header>

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <a href="{{ site.github.repository_url }}">{{ site.github.owner_name }}/{{ site.github.repository_name }}</a>
    </div>
  </footer>

  <script defer src="{{ "/assets/js/site.js" | absolute_url }}"></script>
</body>
</html>
